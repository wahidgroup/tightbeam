name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "release/*"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest-l
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup
        run: make setup

      - name: CI
        run: make ci

  coverage:
    name: Coverage
    runs-on: ubuntu-latest-l
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The setup installs cargo-llvm-cov at its pin, and the toolchain file
      # names `llvm-tools-preview`.
      - name: Setup
        run: make setup

      - name: Coverage
        run: make coverage

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/html/
          retention-days: 14

  loom:
    name: Loom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup
        run: make setup

      - name: Loom
        run: make loom

  interop:
    name: Interop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 4.1.0 is the first OpenSSL that reads the RFC 5083 tags and checks the
      # authAttrs as AAD, so `make ci` on the stock OpenSSL leaves the tag of a
      # sealed sample to this job.
      OPENSSL_VERSION: 4.1.0
      OPENSSL_SHA256: 50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd
      OPENSSL_PREFIX: /home/runner/.local/openssl-4.1.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-directories: /home/runner/.local/openssl-4.1.0

      - name: Setup
        run: make setup

      - name: Build OpenSSL
        run: |
          if [ -x "$OPENSSL_PREFIX/bin/openssl" ]; then
            exit 0
          fi

          cd "$RUNNER_TEMP"
          curl -fsSL -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  openssl.tar.gz" | sha256sum -c -
          tar xzf openssl.tar.gz
          cd "openssl-$OPENSSL_VERSION"
          ./Configure --prefix="$OPENSSL_PREFIX" --libdir=lib no-shared no-tests no-docs
          make -j"$(nproc)"
          make install_sw install_ssldirs

      - name: Interop
        run: OPENSSL="$OPENSSL_PREFIX/bin/openssl" make interop

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      # The cache restores the cargo-afl binary, so it also holds the AFL++
      # runtime that the install built outside CARGO_HOME.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-directories: ~/.local/share/afl.rs

      - name: Setup
        run: make setup

      # One second proves that each target builds with `--cfg fuzzing`, that AFL
      # starts it, and that its seeds pass, and Nightly runs the campaign.
      - name: Fuzz
        run: make fuzz-test seconds=1 skip-missing-crashes=1 skip-cpu-freq=1
        env:
          AFL_FAST_CAL: "1"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check workspace on MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-features
