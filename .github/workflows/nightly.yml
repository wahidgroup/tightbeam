name: Nightly

# This workflow runs the checks that need a schedule. `make ci` (see
# .github/workflows/ci.yml) gates every pull request. These jobs run here:
#
# - A new RustSec advisory invalidates a green build with no change.
# - A fuzz campaign needs more run time than a PR can hold.
# - Miri interprets each test it runs, so its pass needs more run time than a PR can hold.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup
        run: make setup

      - name: Security Audit
        run: make audit

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup
        run: make setup

      # The runner exposes neither the crash-reporting sysctl nor the CPU
      # governor, so both AFL preflight checks are waived here alone.
      - name: Fuzz
        run: make fuzz-test seconds=600 skip-missing-crashes=1 skip-cpu-freq=1

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: built/fuzz/out/
          retention-days: 14

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: miri, rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Miri
        run: make miri
