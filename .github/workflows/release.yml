name: Release

on:
  push:
    tags:
      - "releases/v*"
      - "releases/derive/v*"

# The workflow default is read-only, and each job widens only what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      title: ${{ steps.version.outputs.title }}
      derive: ${{ steps.version.outputs.derive }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag publishes only a commit that master or a release branch already
      # holds.
      - name: Require the tagged commit on a release base
        run: |
          set -euo pipefail
          for base in $(git for-each-ref --format='%(refname)' \
            refs/remotes/origin/master 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$base"; then
              exit 0
            fi
          done
          echo "${GITHUB_SHA} is on neither master nor a release branch."
          exit 1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup
        run: make setup

      - name: Verify version matches tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == releases/derive/* ]]; then
            VERSION="${tag#releases/derive/v}"
            CRATE="tightbeam-derive"
            DERIVE=1
          else
            VERSION="${tag#releases/v}"
            CRATE="tightbeam-rs"
            DERIVE=0
          fi
          CURRENT="$(./scripts/crate-version.sh "$CRATE")"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "${CRATE} version (${CURRENT}) does not match tag (${VERSION})"
            echo "Bump on master via make release version=v${VERSION} before tagging."
            exit 1
          fi
          echo "derive=$DERIVE" >> "$GITHUB_OUTPUT"
          echo "title=${CRATE} v${VERSION}" >> "$GITHUB_OUTPUT"

      # One flag selects the crate for both registry checks, so a derive-only
      # tag is graded against tightbeam-derive alone.
      - name: Refuse yanked versions
        run: make check-yanked derive=${{ steps.version.outputs.derive }}

      - name: Verify the version bump covers the API change
        run: make check-semver derive=${{ steps.version.outputs.derive }}

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Trusted Publishing exchanges the OIDC token for a short-lived registry
      # token, so the repository stores no long-lived CARGO_REGISTRY_TOKEN.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish tightbeam-derive
        if: needs.verify.outputs.derive == '1'
        run: cargo publish --locked --package tightbeam-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # tightbeam-rs depends on tightbeam-derive, so the dependency must be
      # resolvable on the registry before the dependent publish starts.
      - name: Publish tightbeam-derive (if needed)
        if: needs.verify.outputs.derive == '0'
        run: |
          set -euo pipefail
          derive_version="$(./scripts/crate-version.sh tightbeam-derive)"
          if [ "$(./scripts/crates-io.sh tightbeam-derive "$derive_version")" = "published" ]; then
            echo "tightbeam-derive ${derive_version} already on crates.io, skipping"
          else
            cargo publish --locked --package tightbeam-derive
            ./scripts/await-publish.sh tightbeam-derive "$derive_version"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # The verify build resolves tightbeam-derive from crates.io. With every
      # feature on, as docs.rs builds, a stale published derive fails here
      # before the upload.
      - name: Publish tightbeam-rs
        if: needs.verify.outputs.derive == '0'
        run: cargo publish --locked --package tightbeam-rs --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Cargo 1.94 writes the published package to `target/package/tmp-crate/`,
      # and older releases to `target/package/`, so the path matches both.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/package/**/*.crate

  release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.verify.outputs.title }}
          generate_release_notes: true
