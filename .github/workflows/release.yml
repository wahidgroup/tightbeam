name: Release

on:
  push:
    tags:
      - "releases/v*"
      - "releases/derive/v*"

# Read-only by default. Each job widens only what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  # Everything that compiles, installs, or runs project code lives here, where
  # no registry credential can be minted. A build script or proc macro that
  # runs in this job has no OIDC endpoint to reach.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      title: ${{ steps.version.outputs.title }}
      derive: ${{ steps.version.outputs.derive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup
        run: make setup

      - name: CI
        run: make ci

      - name: Verify version matches tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == releases/derive/* ]]; then
            VERSION="${tag#releases/derive/v}"
            CRATE="tightbeam-derive"
            DERIVE=1
          else
            VERSION="${tag#releases/v}"
            CRATE="tightbeam-rs"
            DERIVE=0
          fi
          CURRENT="$(./scripts/crate-version.sh "$CRATE")"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "${CRATE} version (${CURRENT}) does not match tag (${VERSION})"
            echo "Bump on master via make release version=v${VERSION} before tagging."
            exit 1
          fi
          echo "derive=$DERIVE" >> "$GITHUB_OUTPUT"
          echo "title=${CRATE} v${VERSION}" >> "$GITHUB_OUTPUT"

      # One flag selects the crate for both registry checks, so a derive-only
      # tag is never graded against tightbeam-rs.
      - name: Refuse yanked versions
        run: make check-yanked derive=${{ steps.version.outputs.derive }}

      - name: Verify the version bump covers the API change
        run: make check-semver derive=${{ steps.version.outputs.derive }}

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      # Trusted Publishing exchanges the OIDC token for a short-lived registry
      # token, so no long-lived CARGO_REGISTRY_TOKEN is stored.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish tightbeam-derive
        if: needs.verify.outputs.derive == '1'
        run: cargo publish --locked --package tightbeam-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # tightbeam-rs depends on tightbeam-derive, so the dependency must be
      # resolvable on the registry before the dependent publish starts.
      - name: Publish tightbeam-derive (if needed)
        if: needs.verify.outputs.derive == '0'
        run: |
          set -euo pipefail
          derive_version="$(./scripts/crate-version.sh tightbeam-derive)"
          if [ "$(./scripts/crates-io.sh tightbeam-derive "$derive_version")" = "published" ]; then
            echo "tightbeam-derive ${derive_version} already on crates.io, skipping"
          else
            cargo publish --locked --package tightbeam-derive
            ./scripts/await-publish.sh tightbeam-derive "$derive_version"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish tightbeam-rs
        if: needs.verify.outputs.derive == '0'
        run: cargo publish --locked --package tightbeam-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate

  release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.verify.outputs.title }}
          generate_release_notes: true
