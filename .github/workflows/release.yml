name: Release

on:
  push:
    tags:
      - "releases/v*"
      - "releases/derive/v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup
        run: make setup

      - name: CI
        run: make ci

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == releases/derive/* ]]; then
            VERSION="${tag#releases/derive/v}"
            CURRENT=$(awk -F'"' '/^\[package\]/{f=1;next} f&&/^\[/{f=0} f&&/^version/{print $2;exit}' tightbeam-derive/Cargo.toml)
            CRATE="tightbeam-derive"
          else
            VERSION="${tag#releases/v}"
            CURRENT=$(awk -F'"' '/^\[workspace\.package\]/{f=1;next} f&&/^\[/{f=0} f&&/^version/{print $2;exit}' Cargo.toml)
            CRATE="tightbeam"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "TITLE=${CRATE} v${VERSION}" >> "$GITHUB_ENV"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "${CRATE} version (${CURRENT}) does not match tag (${VERSION})"
            echo "Bump on master via make release version=v${VERSION} before tagging."
            exit 1
          fi

      - name: Publish tightbeam-derive
        if: startsWith(github.ref, 'refs/tags/releases/derive/')
        run: cargo publish --package tightbeam-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tightbeam-derive (if needed)
        if: startsWith(github.ref, 'refs/tags/releases/v')
        run: |
          local_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tightbeam-derive") | .version')
          published_version=$(cargo search tightbeam-derive --limit 1 \
            | head -1 | sed 's/.*= "\(.*\)".*/\1/')
          if [ "$local_version" = "$published_version" ]; then
            echo "tightbeam-derive ${local_version} already on crates.io, skipping"
          else
            echo "Publishing tightbeam-derive ${local_version} (crates.io has ${published_version})"
            cargo publish --package tightbeam-derive
            echo "Waiting for crates.io index..."
            sleep 30
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tightbeam-rs
        if: startsWith(github.ref, 'refs/tags/releases/v')
        run: cargo publish --package tightbeam-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ env.TITLE }}
          generate_release_notes: true
