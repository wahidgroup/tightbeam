# Spellcheck config for https://github.com/crate-ci/typos (cargo install typos-cli).

[files]
extend-exclude = [
	"target/",
	"built/",
	".make/",
	".git/",
	"Cargo.lock",
	# Embedded base64 / DER fixtures (not prose).
	"tightbeam/src/crypto/x509/utils.rs",
	"tightbeam/src/testing/utils.rs",
]

[default]
# Skip PEM / base64 blob lines and hyphenated mis-* technical compounds.
extend-ignore-re = [
	"(?Rm)^[\\t ]*[A-Za-z0-9+/]{24,}={0,2}[\\t ]*$",
	"(?i)\\bmis-[a-z]+\\b",
]

